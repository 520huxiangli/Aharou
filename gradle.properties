# 基准环境为 GitHub Actions 公共仓库 runner：4 vCPU / 16 GB RAM / 14 GB SSD。
# 16GB 下 daemon 堆给 6144m。这一档跟 flavor 并发直接相关：assembleRelease 一次要编 3 个
# flavor，三个 in-process 编译共享这一个堆，会 GC 互相拖慢直至 OOM。
# （2026-08-24 从 2G 提到 4G 顶过一次，2026-09-28 v1.14.4 在 4G 上复发；
#  2026-10-19 v2.32.0 接入四个平台机器人后 4G 再次 OOM，提到 6G。）
# 并发数上限见下面 workers.max；再撞才考虑继续加堆。
# 这一行是 CI（GitHub Actions，16GB）的基线值。手机容器内由设置页「容器 → Gradle 堆内存上限」
# 写进用户级 ~/.gradle/gradle.properties 覆盖它（Gradle 用户级优先级高于项目根目录这份）。
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC

# Kotlin 编译改 in-process：跑进 Gradle daemon，省掉独立的 Kotlin daemon JVM（再省一份内存）。
# 官方推荐策略之一，详见 kotlin.compiler.execution.strategy。
kotlin.compiler.execution.strategy=in-process

# 上限给 2：3 个 flavor 的 in-process Kotlin 编译同时跑会超出 4GB 堆（实测三个
# compile{Armsolo,Universal,X86solo}ReleaseKotlin 一起 OOM）；两个并发约 2.7GB，留有余量。
# R8 阶段本来就是串行压，上限 2 对它无影响。代价是 release 构建慢几分钟。
org.gradle.workers.max=2

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
# 配置缓存：缓存命中时直接跳过整个配置阶段（脚本编译 + 插件初始化与 task 图构建）。
# problems=warn 让不兼容项只告警不中断构建。
# 注意属性名：叫 configuration-cache（不是 configure-cache），写错不会报错而是默默失效。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.enableJetifier=true
# Jetifier 跳过 byte-buddy（mockk 传递依赖）：其 1.18.x 是 multi-release jar，
# META-INF/versions/24/ 下类按 Java 24 编译（class file 68），Jetifier 内置 ASM 不支持。
# 它是纯 JVM 测试库、不引用 support 包，无需转换。
android.jetifier.ignorelist=byte-buddy,byte-buddy-agent

android.suppressUnsupportedCompileSdk=37
