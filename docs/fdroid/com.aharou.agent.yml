Name: Aharou
Summary: AI coding agent with terminal, Linux container and Git
Description: |-
  Aharou is an AI-powered coding agent for Android. It embeds a terminal
  emulator, a Linux container (PRoot/Alpine) and Git integration, and connects
  to Anthropic, OpenAI or any OpenAI-compatible API provider to generate,
  review and execute code directly on the device.

  Features:
  * Built-in terminal with Termux components
  * Linux container environment (Alpine/Ubuntu/Debian) via PRoot
  * Git repository management and visual commit history
  * Multi-provider model support with cost tracking
  * Remote SSH server and SFTP file access
  * MCP (Model Context Protocol) client support
  * In-app update download with mirror fallback

