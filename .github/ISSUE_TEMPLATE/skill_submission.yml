name: 🧩 技能投稿
description: 把你写的技能提交到官方源，让所有人在技能市场里装到
body:
  - type: markdown
    attributes:
      value: |
        感谢投稿！官方源收录在仓库的 `skills/` 目录，合并后所有人在「技能市场 → Aharou 官方」里就能装到。

        **更推荐直接提 PR**：fork 本仓库，把 `skills/<标识>/SKILL.md` 加上去再提 PR，比等审核快。
        提交前请先翻一下 `skills/` 目录里已收录的技能，避免功能重复。

  - type: input
    id: skill_name
    attributes:
      label: 技能标识
      description: 英文小写加连字符，会作为目录名，也是 AI 加载技能时用的名字。
      placeholder: 例如 pdf-report
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: 中文名
      description: 显示在技能市场与技能列表里的名字。
      placeholder: 例如 PDF 报表生成
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 一句话说明什么时候该用它
      description: 写进 frontmatter 的 description。AI 靠这句话判断要不要加载这个技能，写清适用场景，不适用的情况也点一句。
      placeholder: 例如「需要把表格数据做成 PDF 报表时使用。纯文本整理不用它。」
    validations:
      required: true

  - type: textarea
    id: skill_md
    attributes:
      label: SKILL.md 正文
      description: 技能的完整指令（Markdown）。写清标准流程、约束与注意事项；要能照着跑出结果，不是只描述思路。
    validations:
      required: true

  - type: textarea
    id: deps
    attributes:
      label: 依赖
      description: 技能运行前要装什么（系统包、Python 库、外部命令），以及装法。没有就写「无」。

  - type: textarea
    id: origin
    attributes:
      label: 来源与许可
      description: 改编自别处的技能请给出原仓库地址与它的许可协议，我们会一并登记到 NOTICE。完全原创写「原创」即可。

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 正文里没有 API Key、令牌、私人地址等敏感信息
          required: true
        - label: 我同意这个技能以 GPL-3.0 收录进本仓库
          required: true
        - label: 正文是可运行的完整技能，不是草稿或思路
          required: true
