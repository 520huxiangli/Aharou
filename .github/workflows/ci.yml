name: CI

# push 到 master 或 PR 时触发：构建 universal debug（单 flavor 冒烟）+ 跑单元测试。
# 目的是合入前的兜底门禁，避免编译错误/回归推迟到打 tag 发版当天才暴露。
# 打 v* tag 的发版构建走 android-release.yml，不在这里。
on:
  push:
    branches: [ master ]
    # 提示词、技能及用户手册会进入 APK，不能按扩展名忽略 Markdown。
    paths-ignore:
      - 'docs/**'
      - 'data/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - 'data/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # 编译闸门的 CI 放行开关（gradlew 读它）：一个 job 里会多次调 gradlew，
      # 而本地授权文件是一次性消费的，不显式放行的话第二次（单测）会被误拒。
      # gradlew 还要求 GITHUB_ACTIONS=true 同时成立，本地 export 一行绕不过去。
      AHAROU_CI_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 在配置阶段取
          # git rev-list --count HEAD，浅克隆（默认 depth=1）会得到 1，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # PR 用只读缓存，仅 master 的 push 写回缓存，避免被 PR 污染。
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # Robolectric 的 android-all-instrumented 运行时（约 190MB）由它自己的 Maven 拉取器下载到
      # ~/.m2/repository，不在 setup-gradle 的缓存范围内。不缓存则每次跑单测都要重下一遍，
      # 网络抖动会让 MigrationTest 在类初始化就挂（MavenArtifactFetcher FileNotFoundException）。
      - name: Cache Robolectric runtime
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew
          # API 推送会丢文件执行位；不关掉 fileMode，chmod 会让 git 判定工作区脏，
          # 版本号被挂上 -dirty，装上去之后会一直提示有新版。
          git config core.fileMode false

      # 迁移版本号对账：编号连续、SCHEMA_VERSION 一致、已发布迁移未被篡改/复用
      # （hotfix 合流后 master 未把未发布迁移后移会在这里被拦）。
      - name: Check migration versions
        run: python3 scripts/check_migrations.py

      # 官方技能自检：frontmatter 与命名、description 长度、验收用例是否齐全、
      # 市场配置两处是否一致、展示名有没有同步进文档。
      - name: Check official skills
        run: python3 scripts/check_skills.py

      # 架构门禁：禁用组件 import、文件行数棘轮、双语 strings 一致性。
      - name: Check architecture rules
        run: python3 scripts/check_architecture.py

      # 基线只许缩：--sync-baseline 一条命令就能把棘轮抬起来，不做 diff 比对时 CI 会照常通过。
      # 只对「数值上涨 / 新增登记」报错，收紧与删除放行。
      - name: Verify architecture baseline only shrinks
        run: python3 scripts/check_architecture.py --check-ratchet

      - name: Test preinstalled image scripts without network or Docker
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_preinstalled*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_stage_preinstalled_assets.py'

      - name: Stage published preinstalled Alpine assets
        run: python3 scripts/stage_preinstalled_assets.py --apply

      # 单 flavor 冒烟：只构 universal debug（CLAUDE.md 规范：AI 改完编译型代码默认跑这个），
      # 不构全量三 flavor，省三倍 Kotlin 编译。
      - name: Build universal debug (smoke)
        run: ./gradlew :app:assembleUniversalDebug --stacktrace

      # 单元测试（app/src/test 下的 Kotlin 单测）。
      # 只跑 universal debug 变体：单测逻辑与 flavor 无关（flavor 仅影响 abiFilters/assets），
      # 跑全 flavor 6 变体是重复编译，无额外覆盖。
      - name: Run unit tests
        # 用 tee 而不是重定向：重定向会把 Gradle 输出全写进文件，job 日志里就只剩一行命令，
        # 失败时完全看不到原因（2026-10-25 为此绕了一大圈）。pipefail 保证 gradle 的退出码不被 tee 吃掉。
        run: |
          set -o pipefail
          ./gradlew :app:testUniversalDebugUnitTest --console=plain 2>&1 | tee /tmp/unit.log || touch /tmp/unit-tests-failed

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: /tmp/unit.log
          retention-days: 7
          if-no-files-found: warn

      # 失败原因写进步骤摘要 + 错误注解：GitHub 的日志接口会截断长日志，单测挂在哪一条
      # 从日志里看不到（之前只能拿到 exit code 1），而注解能通过 API 直接读到。
      # 注解必须直接打到 stdout：整块重定向进 $GITHUB_STEP_SUMMARY 时，::error 只是摘要里的一行
      # 普通文字，不会变成 Actions annotation。
      - name: Summarize unit test failures
        if: always()
        run: |
          reports=app/build/test-results/testUniversalDebugUnitTest
          failed_files=""
          tests_failed=0
          if compgen -G "$reports/*.xml" > /dev/null; then
            failed_files=$(grep -l '<failure' "$reports"/*.xml 2>/dev/null || true)
            if [ -n "$failed_files" ]; then
              tests_failed=1
              for f in $failed_files; do
                echo "::error title=单测失败::$(basename "$f")"
              done
            fi
          else
            tests_failed=1
            echo '::error title=单测无报告::测试进程在写出报告前就崩了（OOM / 超时）'
          fi
          # 日志尾部只在失败时进注解：成功时也打 error 注解的话，每次跑绿都挂着一条红字。
          if [ "$tests_failed" = 1 ]; then
            crash=$(tail -8 /tmp/unit.log 2>/dev/null | tr '\n' '~' | cut -c1-900 || true)
            if [ -n "$crash" ]; then
              echo "::error title=单测日志尾::${crash}"
            fi
          fi

          {
            echo '### 单测结果'
            if [ -n "$failed_files" ]; then
              for f in $failed_files; do
                echo "失败文件: $(basename "$f")"
              done
            elif compgen -G "$reports/*.xml" > /dev/null; then
              echo '全部用例通过'
            else
              echo '没有生成测试报告：测试进程可能在写出报告前就崩了（OOM / 超时）'
              echo '```'
              tail -30 /tmp/unit.log 2>/dev/null || echo '（没有 /tmp/unit.log）'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testUniversalDebugUnitTest/**
          retention-days: 7
          if-no-files-found: warn

      - name: Verify unit test execution and reports
        if: always()
        run: |
          set -e
          test ! -f /tmp/unit-tests-failed
          python3 scripts/check_unit_test_results.py app/build/test-results/testUniversalDebugUnitTest
