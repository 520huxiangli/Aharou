name: Sync Container Images

# 容器镜像（Alpine/Ubuntu/Debian 的 rootfs）此前全靠人工：查新版本 → 下两个 ABI → 对
# SHA256SUMS → 改名 → 传 cnb → 改清单。本工作流把这段自动化，App 的自建源只认 cnb。
on:
  schedule:
    # 每周一 UTC 05:20 自动执行（北京时间 13:20）。上游 rootfs 只随发行版小版本更新，周更足够。
    - cron: '20 5 * * 1'
  workflow_dispatch: # 支持在 Actions 界面手动触发

# 同一时刻只允许一次同步，避免两次运行撞车（附件是覆盖写，撞车会互相盖掉）。
concurrency:
  group: sync-container-images
  cancel-in-progress: false

# 脚本会改清单，需要回写 master。
permissions:
  contents: write

jobs:
  sync-container-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up emulation for arm64 rootfs builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Verify preinstalled build and publish contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_preinstalled*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_stage_preinstalled_assets.py'

      - name: Check preinstalled image plan (offline)
        run: python3 scripts/sync-container-images.py --preinstall

      - name: Synchronize verified upstream base images
        id: base_sync
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: python3 scripts/sync-container-images.py --apply

      # 在隔离 Docker 环境预装并校验，两个架构都发布成功才更新条目。
      - name: Build, verify and publish preinstalled images
        id: preinstalled_sync
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: python3 scripts/sync-container-images.py --preinstall --apply --image alpine-3.24

      - name: Commit manifest if changed
        if: ${{ !cancelled() && (steps.base_sync.outcome == 'success' || steps.base_sync.outcome == 'failure' || steps.preinstalled_sync.outcome == 'success' || steps.preinstalled_sync.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/container-images.json data/container-images.json
          if git diff --cached --quiet; then
            echo "清单无变化，跳过提交"
          else
            git commit -m "chore(container): 同步容器镜像新版本"
            git push
          fi