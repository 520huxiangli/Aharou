name: Temp Export Keystore

# 临时工作流：仅用于把仓库 Secret 里的正式包签名 keystore 导出为 artifact。
# 用途完成后立即删除本文件与相关 artifact / run 记录。
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore from secret
        env:
          KS_B64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > aharou-release.jks
          ls -la aharou-release.jks
          sha256sum aharou-release.jks

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: aharou-release-jks
          path: aharou-release.jks
          retention-days: 1
