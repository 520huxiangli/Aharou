name: Temp Export Keystore

# 临时工作流：导出正式包签名 keystore。
#   - keystore 本体 → artifact（下载需仓库权限）
#   - store/key 口令 → 用一次性 RSA 公钥加密后输出到日志（密文公开无害，仅本地私钥可解）
# 用途完成后立即删除本文件、artifact 与 run 记录。
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > aharou-release.jks
          ls -la aharou-release.jks

      - name: Encrypt passwords with one-time public key
        env:
          KS_PW: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.AICODE_KEY_PASSWORD }}
          ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
        run: |
          echo '' | base64 -d > pub.pem
          enc() { printf '%s' "$1" | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:pkcs1 | base64 -w0; }
          echo "ENC_STORE_PW=$(enc "$KS_PW")"
          echo "ENC_KEY_PW=$(enc "$KEY_PW")"
          echo "ENC_ALIAS=$(enc "$ALIAS")"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: aharou-release-jks
          path: aharou-release.jks
          retention-days: 1
