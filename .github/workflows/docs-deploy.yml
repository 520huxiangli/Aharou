name: Deploy Docs

# 文档站部署：构建 VitePress 站点并发布到 GitHub Pages。
# 选 Pages 是因为它用仓库自带的 GITHUB_TOKEN，不需要任何第三方凭据（Vercel 那套要人工配 token）。
# 地址：https://520huxiangli.github.io/Aharou/
# 仅在打 tag 时部署，避免 master 上尚未随版本发布的文档被公开。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 部署串行：不取消进行中的那次，避免 Pages 处于半发布状态。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # GitHub Pages 的项目页挂在 /Aharou/ 子路径下，必须告诉 VitePress base，
      # 否则打包出来的资源路径全是根路径、上线即 404（这是换托管最容易踩的坑）。
      - name: Build site
        env:
          VITEPRESS_BASE: /Aharou/
          SITE_URL: https://520huxiangli.github.io/Aharou
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动在仓库开启 Pages（Source = GitHub Actions），省得手动去设置里点。
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
