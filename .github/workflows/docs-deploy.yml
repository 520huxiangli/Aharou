name: Deploy Docs

# 文档站只在打 tag 时部署，避免 main 上尚未随版本发布的文档被公开。
# Vercel 的 Git 自动部署已在 docs-site/vercel.json 用 git.deploymentEnabled=false 关闭，
# 生产部署统一由本工作流用 Vercel CLI 完成。
# 前置配置（GitHub 仓库 Secret）：VERCEL_TOKEN、VERCEL_ORG_ID、VERCEL_PROJECT_ID
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy Docs to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    # vercel.json / package-lock.json 都在 docs-site，项目根即此处。
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 未配置 Vercel 凭据时只发警告并跳过部署：文档站是可选的对外站点，
      # 缺 Secret 不该让 tag 发版整条流水线变红，掩盖真正的构建问题。
      - name: Check Vercel credentials
        id: vercel_check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::未配置 VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID，跳过文档站部署（在仓库 Settings→Secrets→Actions 配置后自动生效）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        if: steps.vercel_check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install Vercel CLI
        if: steps.vercel_check.outputs.skip != 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.vercel_check.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.vercel_check.outputs.skip != 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        if: steps.vercel_check.outputs.skip != 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}