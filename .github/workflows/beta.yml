name: Beta Build

# push 到 master 时自动构建一个测试包：universal flavor、正式签名、与 release 同配置（R8/资源压缩），
# 仅 applicationId 后缀 .beta（com.aharou.agent.beta，可与正式版同机共存）。
# 产物传 Actions Artifacts（保留 90 天），同时发/更新一个固定 tag 的 prerelease Release
# （tag=beta-latest），App 的「测试版」通道能直接检测到并下载，不必手动摸 Actions。
# 打 v* tag 的正式发版走 android-release.yml；合入前门禁走 ci.yml。
on:
  push:
    branches: [ master ]
    # 提示词、技能及用户手册属于 APK 运行时资产，不按 Markdown 扩展名跳过。
    paths-ignore:
      - 'docs/**'
      - 'data/**'
      - 'LICENSE'
      - '.gitignore'
  # 允许在 Actions 页面手动触发，便于验证链路。
  workflow_dispatch:

# 同分支新提交到来时取消正在跑的旧 beta 构建，省额度。
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

# 发/更新 beta-latest Release 需要写权限。
permissions:
  contents: write

jobs:
  build:
    name: Build Beta APK
    runs-on: ubuntu-latest
    env:
      # 编译闸门的 CI 放行开关：一个 job 里会多次调 gradlew。
      # gradlew 同时要求 GITHUB_ACTIONS=true，只在本地 export 不会放行。
      AHAROU_CI_BUILD: "1"

    steps:
      # 手动触发没有分支约束：从功能分支手动跑一次就会把 beta-latest 覆盖成非 master 的包，
      # 测试版通道的用户立刻收到它。只允许在 master 上手动发。
      - name: Verify manual run is from master
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::手动触发只允许 master 分支（当前 $GITHUB_REF）"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 取 git rev-list --count HEAD，
          # 浅克隆（默认 depth=1）会得到 1，必须拉完整历史，否则版本号错乱。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # beta 用正式签名：从 Secret 还原 keystore 到 app/aicode.jks，并生成 keystore.properties，
      # 与 android-release.yml 完全一致；缺任一步 beta 包会变成 unsigned。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/aicode.jks
          echo "keystore restored ($(stat -c%s app/aicode.jks) bytes)"

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          cat > app/keystore.properties <<EOF
          storeFile=aicode.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "app/keystore.properties generated"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew
          # API 推送会丢文件执行位；不关掉 fileMode，chmod 会让 git 判定工作区脏，
          # 版本号被挂上 -dirty，装上去之后会一直提示有新版。
          git config core.fileMode false

      # beta 包同样过三道门禁（完整历史已拉，迁移对账的 git tag 判定可用）：
      # 迁移编号对账、官方技能自检、架构门禁。
      - name: Check migration versions
        run: python3 scripts/check_migrations.py

      - name: Check official skills
        run: python3 scripts/check_skills.py

      - name: Check architecture rules
        run: python3 scripts/check_architecture.py

      - name: Cache Robolectric runtime
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Stage published preinstalled Alpine assets
        run: python3 scripts/stage_preinstalled_assets.py --apply

      - name: Test the checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testUniversalDebugUnitTest --console=plain --stacktrace
          python3 scripts/check_unit_test_results.py app/build/test-results/testUniversalDebugUnitTest

      - name: Upload beta unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-unit-tests-${{ github.sha }}
          path: app/build/test-results/testUniversalDebugUnitTest/**
          retention-days: 7
          if-no-files-found: warn

      # 构建 universal beta（arm64-v8a + x86_64，含两套容器镜像的通用包）。
      # --stacktrace：失败时输出完整调用栈，便于定位 OOM/内存类根因。
      - name: Build beta APK
        run: ./gradlew :app:assembleUniversalBeta --stacktrace

      # 产物重命名为 Aharou-universal-beta-<sha7>.apk，短 sha 便于区分每次构建。
      # 同时带上 R8 混淆映射（mapping.txt），供 beta 崩溃报告反混淆。
      - name: Rename APK & collect mapping
        run: |
          set -e
          mkdir -p dist
          sha7="${GITHUB_SHA::7}"
          cp "app/build/outputs/apk/universal/beta/app-universal-beta.apk" \
             "dist/Aharou-universal-beta-${sha7}.apk"
          # AGP 8.x 的 mapping 输出目录是 variant 驼峰名（flavor + BuildType），
          # 即 outputs/mapping/universalBeta/，不是 outputs/mapping/universal/beta/。
          # mapping.txt 未压缩有 130MB+，gzip 后不到 10MB（与 android-release.yml 一致）。
          if [[ -f "app/build/outputs/mapping/universalBeta/mapping.txt" ]]; then
            gzip -c "app/build/outputs/mapping/universalBeta/mapping.txt" \
              > "dist/Aharou-universal-beta-${sha7}-mapping.txt.gz"
          fi
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aharou-beta-${{ github.sha }}
          # Artifacts 默认保留 90 天，无需显式配置。
          path: |
            dist/Aharou-universal-beta-*.apk
            dist/Aharou-universal-beta-*-mapping.txt.gz
          if-no-files-found: error

      # 固定 tag beta-latest：每次都覆盖同一个 Release，不累积历史版本。
      # 标为 prerelease，所以「稳定版」通道（只收 !prerelease）看不到它；
      # App 的「测试版」通道（UpdateChannel.LATEST，全收）能直接检测到并下载。
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="beta-latest"
          sha7="${GITHUB_SHA::7}"
          # 先清掉旧 Release 与它带的 tag（不存在时 gh 会报错，忽略即可）。
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --title "测试版 ${sha7}" \
            --notes "master 自动构建的测试包。提交 ${GITHUB_SHA}。\n\n应用内「设置 → 关于 → 更新通道 → 测试版」可直接检测并下载。" \
            --prerelease \
            dist/Aharou-universal-beta-*.apk \
            dist/Aharou-universal-beta-*-mapping.txt.gz
          echo "已更新 Release: $tag"