name: Build NapCat Preinstalled Rootfs

on:
  workflow_dispatch:

concurrency:
  group: napcat-preinstalled-rootfs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require master
        run: |
          test "$GITHUB_REF" = refs/heads/master || { echo 'Publish only from master'; exit 1; }
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Verify preinstalled build and publish contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_preinstalled*.py'
      - name: Review offline build plan
        run: python3 scripts/sync-napcat-assets.py --preinstall
      - name: Build and publish verified runtime assets
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: python3 scripts/sync-napcat-assets.py --preinstall --apply
      - name: Commit verified manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/napcat-downloads.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(im): 更新已校验的 NapCat 预装运行镜像'
            git push origin HEAD:master
          fi
